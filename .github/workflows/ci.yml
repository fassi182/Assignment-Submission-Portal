
name: Assignment Portal CI

on:
  push:

permissions:
  contents: read

jobs:
  test:
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          py -3.11 -m pip install --upgrade pip
          py -3.11 -m pip install -r requirements.txt

      - name: Run automated tests
        id: tests
        continue-on-error: true
        run: |
          py -3.11 -m pytest -v --json-report --json-report-file=test-report.json

      - name: Send test report to local receiver
        if: always()
        env:
          REPO_NAME: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          if (Test-Path "test-report.json") {
            $pytestReport = Get-Content "test-report.json" -Raw | ConvertFrom-Json
          }
          else {
            $pytestReport = @{
              summary = @{
                total = 0
                passed = 0
                failed = 0
                error = 1
              }
              tests = @()
            }
          }

          $payload = @{
            repo_name = $env:REPO_NAME
            branch = $env:BRANCH
            commit_sha = $env:COMMIT_SHA
            run_id = $env:RUN_ID
            pytest_report = $pytestReport
          } | ConvertTo-Json -Depth 100

          Invoke-RestMethod `
            -Uri "http://127.0.0.1:8001/report" `
            -Method Post `
            -ContentType "application/json" `
            -Body $payload

      - name: Fail workflow if tests failed
        if: steps.tests.outcome == 'failure'
        run: exit 1

  deploy-pages:
    name: Deploy to GitHub Pages
    needs: test
    if: github.ref == 'refs/heads/main' && needs.test.result == 'success'
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/pages-demo

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
